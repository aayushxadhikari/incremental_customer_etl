name: ETL checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable database
        run: cp config/db.env.example config/db.env
      - name: Start MySQL and build the Python 3.11 / Java 17 runner
        run: |
          docker compose -p customer-etl-test -f compose.yaml -f compose.test.yaml --env-file config/db.env up -d --wait mysql
          docker compose -p customer-etl-test -f compose.yaml -f compose.test.yaml --env-file config/db.env build etl
      - name: Run transformation and database integration tests
        run: docker compose -p customer-etl-test -f compose.yaml -f compose.test.yaml --env-file config/db.env run --rm etl python -m unittest discover -v
      - name: Database logs on failure
        if: failure()
        run: docker compose -p customer-etl-test -f compose.yaml -f compose.test.yaml --env-file config/db.env logs mysql
